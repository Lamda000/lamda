<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ラムダ</title>
  <style>
    /* 緑を基調としたミニマルデザイン */
    body {
      background-color: #e8f5e9;
      color: #1b5e20;
      font-family: 'Helvetica Neue', Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      overflow: hidden;
    }
    .search-box {
      background: #ffffff;
      padding: 40px;
      border-radius: 8px;
      box-shadow: 0 4px 12px rgba(46, 125, 50, 0.1);
      text-align: center;
      position: relative;
      z-index: 10;
      width: 320px;
    }
    h2 {
      margin-top: 0;
      margin-bottom: 24px;
      font-size: 24px;
      color: #2e7d32;
      letter-spacing: 2px;
      font-weight: 500;
    }
    .input-group {
      margin-bottom: 16px;
      text-align: left;
    }
    input[type="text"] {
      width: 100%;
      box-sizing: border-box;
      padding: 12px 16px;
      border: 1px solid #a5d6a7;
      border-radius: 4px;
      font-size: 16px;
      outline: none;
      transition: border-color 0.3s;
    }
    input[type="text"]:focus {
      border-color: #4caf50;
    }
    button {
      width: 100%;
      padding: 12px 24px;
      background-color: #4caf50;
      color: #fff;
      border: none;
      border-radius: 4px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.3s;
      margin-top: 8px;
    }
    button:hover {
      background-color: #388e3c;
    }

    /* 黒猫のイースターエッグ用スタイル */
    #black-cat {
      position: absolute;
      bottom: 30px;
      right: -100px;
      font-size: 48px;
      z-index: 20;
      display: none;
    }
    
    @keyframes walkAcross {
      0% { right: -100px; transform: scaleX(1); }
      100% { right: 100vw; transform: scaleX(1); }
    }
    
    .walking {
      display: block !important;
      animation: walkAcross 5s linear forwards;
    }
  </style>
</head>
<body>

  <div class="search-box">
    <h2>ラムダ</h2>
    <form id="searchForm">
      <div class="input-group">
        <input type="text" id="modelNumber" placeholder="品番 (例: CS-220DFL)" required>
      </div>
      <div class="input-group">
        <input type="text" id="searchTerm" placeholder="調べたい用語 (例: エラー H11)">
      </div>
      <button type="submit">検索</button>
    </form>
  </div>

  <div id="black-cat">🐈‍⬛</div>

  <script>
    // ▼ GASのウェブアプリURLに書き換えてください ▼
    const GAS_URL = "YOUR_GAS_WEB_APP_URL";

    document.getElementById('searchForm').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const modelNumber = document.getElementById('modelNumber').value.trim();
      const searchTerm = document.getElementById('searchTerm').value.trim();
      
      // --- イースターエッグのギミック ---
      if (modelNumber.toLowerCase() === 'green' || searchTerm.toLowerCase() === 'green') {
        const cat = document.getElementById('black-cat');
        cat.classList.remove('walking');
        void cat.offsetWidth; 
        cat.classList.add('walking');
        
        document.getElementById('modelNumber').value = '';
        document.getElementById('searchTerm').value = '';
        return; 
      }
      // ----------------------------------

      // 1. Google検索に戻す（一番精度が高い）
      let queryText = modelNumber + " 取扱説明書";
      if (searchTerm !== "") {
        queryText += " " + searchTerm;
      } else {
        queryText += " filetype:pdf";
      }
      
      const searchQuery = encodeURIComponent(queryText);
      const searchUrl = "https://www.google.com/search?q=" + searchQuery;
      
      window.open(searchUrl, '_blank');

      // 2. 裏側でスプレッドシートに記録する
      fetch(GAS_URL, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/x-www-form-urlencoded'
        },
        body: JSON.stringify({ 
          modelNumber: modelNumber,
          searchTerm: searchTerm
        })
      }).catch(error => console.error('Error:', error));
      
      // 検索窓を空にする
      document.getElementById('modelNumber').value = '';
      document.getElementById('searchTerm').value = '';
    });
  </script>
</body>
</html>
